<div class="rule-non-popup">
    <div class="entry-rul-pop">
        <div class="top-con-pop">
            <div class="left-pop-con">
                <h6>
                    Update Stock Price
                </h6>
            </div>
        </div>

        <div class="mid-pop-con">
            <div>
                <span>Do you want to update stock price for risk analysis?</span>
                <span class="mr-3">Yes <input type="radio" name="confirm_update" value="true" [(ngModel)]='data.update'
                        (change)="confirmEvent($event)" /></span>
                <span>No <input type="radio" value="false" name="confirm_update" [(ngModel)]='data.update'
                        (change)="confirmEvent($event)" /></span>
            </div>

            <div>
                <span>Enter the stock price to be used as input to risk analysis: </span>
                <input type="number" (keydown)="preventNegatives($event, false)" min="0"
                    class="form-control cards-input" [(ngModel)]="stockPrice" />
            </div>
        </div>

        <div class="btn-sec">

            <div class="order-btn text-center">
                <a class="btn btn-back" (click)="closeModal(false)">Cancel</a>
            </div>

            <div class="order-btn text-center">
                <a class="btn btn-add" (click)="closeModal(true)">Update</a>
            </div>
        </div>

    </div>
</div>
