<div class="dsh-img reports-chart dashboard-chart">

        <div class="px-3 view-more text-right">
            Click <a routerLink="/import-trades-history" class="view-more cursor">here</a> to import your trades
        </div>

    </div>
    <div [chart]="chart" class="chart-cont"></div>
</div>
