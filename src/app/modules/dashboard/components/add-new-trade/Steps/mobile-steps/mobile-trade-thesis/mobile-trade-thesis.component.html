      <!-- step-fifth -->
     <div class="trade-thesis-sec">
        <div class="container-fluid">

          <div class="trade-stategy-heading">
            <h6>
              Trade Thesis
            </h6>
          </div>

          <div class="trade-thesis-inner">
            <div class="tranding-thesis">
              <div class="left-thesis">
                <h6>Trade executed date</h6>
              </div>
              <div class="right-thesis">
                <div class="form-group">
                  <input class="form-control" placeholder="05-May-2020" type="date">
                </div>
              </div>
            </div>

            <div class="tranding-thesis">
              <div class="left-thesis">
                <h6>Source of trade idea</h6>
              </div>
              <div class="right-thesis">
                <div class="form-group">
                  <select class="form-control select-input" id="inputState">
                    <option>Call</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="tranding-thesis">
              <div class="left-thesis">
                <h6>Profit expected</h6>
              </div>
              <div class="right-thesis">
                <div class="form-group">
                  <input class="form-control" placeholder="263" type="text">
                </div>
              </div>
            </div>

            <div class="tranding-thesis">
              <div class="left-thesis">
                <h6>Target close date</h6>
              </div>
              <div class="right-thesis">
                <div class="form-group">
                  <input class="form-control" placeholder="05-May-2020" type="date">
                </div>
              </div>
            </div>

            <div class="tranding-thesis">
              <div class="left-thesis">
                <h6>Trade executed to take any advantage of</h6>
              </div>
              <div class="right-thesis">
                <div class="form-group">
                  <select class="form-control select-input" id="inputState">
                    <option>Call</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="trading-thesis-trade">
              <div class="top-thesis">
                <h6>
                  Reasons for picking this trade
                </h6>
              </div>
              <div class="bot-thesis">
                <div class="form-group">
                  <textarea class="form-control" id="exampleFormControlTextarea1" rows="2"></textarea>
                </div>
              </div>
            </div>

            <div class="trading-thesis-trade">
              <div class="top-thesis">
                <h6>
                  Risks associated with the trade
                </h6>
              </div>
              <div class="bot-thesis">
                <div class="form-group">
                  <textarea class="form-control" id="exampleFormControlTextarea1" rows="2"></textarea>
                </div>
              </div>
            </div>

          </div>


          <div class="trade-btn-p">
            <a class=" btn-pre" (click)="previous()">Previous</a>
            <a class="btn-pre" (click)="next()">Risk Management</a>

          </div>
        </div>
      </div>
