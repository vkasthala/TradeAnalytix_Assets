<div class="example-box" cdkDrag>
    <form data-drag-boundary="true" class="order-window layer-2 place" [ngClass]="orderToggle ? 'sell' : 'buy' ">
        <header>
            <div class="d-flex">
                <div class="eight columns">
                    <div class="instrument">
                        <span class="transaction-type">{{margins.transaction_type | titlecase}}</span>
                        <span class="tradingsymbol">
                            <span class="name">{{margins.trading_symbol}}</span>
                        </span>
                        ×
                        <span class="qty">{{margins.quantity}} Qty</span>
                    </div>
                    <div class="su-radio-group">
                        <div class="type su-radio-wrap checked">
                            <label class="su-radio-label m-0">₹{{margins.price}}</label>
                        </div>
                    </div>
                </div>
                <div class="four columns text-right">
                    <div class="wrap-right">

                        <div>
                            <span data-balloon="Toggle Buy / Sell" data-balloon-pos="up">
                                <div class="su-switch-group tx-toggle">
                                    <input id="switch-BuySell" name="orderToggle" type="checkbox" stateon="SELL"
                                        stateoff="BUY" class="su-switch" [(ngModel)]="orderToggle"
                                        (change)="changeOrderType($event)" [checked]="orderToggle"
                                        [disabled]="isOrderModify">

                                    <label for="switch-BuySell" class="su-switch-control"></label>
                                </div>
                            </span>
                            <a target="_blank" href="https://www.vrdnation.com" class="info" data-balloon="Help"
                                data-balloon-pos="up">
                                <span class="icon icon-info"></span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <section class="wrap">
            <div class="content">
                <!-- <div class="variety">
                    <div class="su-radio-group">
                        <div class="type su-radio-wrap checked" data-balloon="Regular order" data-balloon-pos="up">
                            <input id="regular" type="radio" name="variety" label="Regular" class="su-radio"
                                value="regular" [(ngModel)]="margins.variety" checked (change)="varietyChange($event)">
                            <label for="regular" class="su-radio-label">Regular</label>
                        </div>
                    </div>
                </div> -->

                <div class="body">
                    <div class="product">
                        <div class="su-radio-group">
                            <div class="type four columns su-radio-wrap checked"
                                data-balloon="Margin Intraday Squareoff: Requires lower margin for equity. Has to be exited before market close."
                                data-balloon-pos="up" data-balloon-length="large"
                                [ngClass]="margins.orderId ? 'disabled' : ''">
                                <input id="MIS" type="radio" name="product" class="su-radio" value="MIS"
                                    [(ngModel)]="margins.product" checked>
                                <label for="MIS" class="su-radio-label">Intraday <span>MIS</span></label>
                            </div>
                            <div class="type four columns su-radio-wrap"
                                data-balloon="CashNCarry: Longterm investment. Requires full upfront margin."
                                data-balloon-pos="up" data-balloon-length="large"
                                [ngClass]="margins.orderId ? 'disabled' : ''">
                                <input id="CNC" type="radio" name="product" class="su-radio" value="CNC"
                                    [(ngModel)]="margins.product">
                                <label for="CNC" class="su-radio-label">Longterm <span>CNC</span></label>
                            </div>
                        </div>
                    </div>
                    <div class="first-fields">
                        <div class="d-flex">
                            <div class="four columns quantity">
                                <div class="no su-input-group su-static-label">
                                    <label class="su-input-label su-visible">Qty.</label>
                                    <input type="number" name="quantity" autocorrect="off" min="1" step="1"
                                        autofocus="autofocus" nativeerror="true" staticlabel="true" animate="true"
                                        dynamicwidthsize="8" [value]="margins.quantity" [(ngModel)]="margins.quantity"
                                        (change)="changeOrderQty($event)" />
                                </div>
                            </div>
                            <div class="four columns price">
                                <div class="no su-input-group su-static-label" [ngClass]="margins.order_type === 'MARKET' || margins.order_type === 'SL-M' ? 'disabled' : ''">
                                    <label class="su-input-label su-visible">Price</label>
                                    <input type="number" autocorrect="off" min="0" step="0.01" nativeerror="true" staticlabel="true" animate="true" label="Price" id="price" dynamicwidthsize="8" [disabled]="margins.order_type === 'MARKET' || margins.order_type === 'SL-M'" [value]="margins.order_type === 'MARKET' || margins.order_type === 'SL-M' ? '0' : orderPlacementPrice" />

                                    <!-- <input type="number" autocorrect="off" min="0.05" step="0.05" nativeerror="true" staticlabel="true" animate="true" label="Price" id="price" dynamicwidthsize="8" [disabled]="margins.order_type === 'MARKET' || margins.order_type === 'SL-M'" [value]="margins.order_type === 'MARKET' || margins.order_type === 'SL-M' ? '0' : orderPlacementPrice"> -->
                                </div>
                            </div>
                            <div class="four columns trigger">
                                <div class="no su-input-group su-static-label"
                                    [ngClass]="margins.order_type == 'MARKET' || margins.order_type == 'LIMIT' ? 'disabled' : ''">
                                    <label class="su-input-label">Trigger price</label>
                                    <input type="number" autocorrect="off" min="0" step="0.01" nativeerror="true"
                                        staticlabel="true" animate="true" label="Trigger price" id="trigger_price"
                                        dynamicwidthsize="8"
                                        [disabled]="margins.order_type == 'MARKET' || margins.order_type == 'LIMIT'"
                                        [value]="margins.order_type === 'MARKET' || margins.order_type === 'LIMIT' ? '0' : margins.trigger_price">
                                </div>
                                <div class="no su-input-group su-static-label" *ngIf="margins.variety === 'co'">
                                    <label class="su-input-label">Stoploss trigger Price</label>
                                    <input type="number" placeholder="" autocorrect="off" min="0" step="0.05"
                                        nativeerror="true" staticlabel="true" animate="true"
                                        label="Stoploss trigger Price" dynamicwidthsize="8"
                                        [value]="margins.trigger_price">
                                </div>
                            </div>
                        </div>
                        <div class="d-flex">
                            <div class="four columns">
                                &nbsp;
                            </div>
                            <div class="four columns price">
                                <div class="su-radio-group order-type">
                                    <div class="su-radio-wrap" tooltip-pos="down" data-balloon="Buy at market price"
                                        data-balloon-pos="down" [ngClass]="margins.orderId ? 'disabled' : ''">
                                        <input id="MARKET" type="radio" name="orderType" label="Market" class="su-radio"
                                            value="MARKET" [(ngModel)]="margins.order_type"
                                            [disabled]="margins.variety !== 'regular' && margins.variety !== 'co'">
                                        <label for="MARKET" class="su-radio-label">Market</label>
                                    </div>
                                    <div class="su-radio-wrap checked" tooltip-pos="down"
                                        data-balloon="Buy at a preferred price" data-balloon-pos="down"
                                        [ngClass]="margins.orderId ? 'disabled' : ''">
                                        <input id="LIMIT" type="radio" name="orderType" label="Limit" class="su-radio"
                                            value="LIMIT" [(ngModel)]="margins.order_type"
                                            [disabled]="margins.variety !== 'regular' && margins.variety !== 'co'">
                                        <label for="LIMIT" class="su-radio-label">Limit</label>
                                    </div>
                                </div>
                            </div>
                            <div class="four columns trigger">
                                <div class="su-radio-group text-right order-type">
                                    <div class="su-radio-wrap" tooltip-pos="down"
                                        data-balloon="Buy at a preferred price with a stoploss" data-balloon-pos="down"
                                        [ngClass]="margins.variety == 'co' ? 'disabled' : ''">
                                        <input id="SL" type="radio" name="orderType" label="SL" class="su-radio"
                                            value="SL" [(ngModel)]="margins.order_type"
                                            [disabled]="margins.variety == 'co'">
                                        <label for="SL" class="su-radio-label">SL</label>
                                    </div>
                                    <div class="su-radio-wrap" tooltip-pos="down"
                                        data-balloon="Buy at market price with stoploss" data-balloon-pos="down"
                                        [ngClass]="margins.variety === 'co' ? 'disabled' : ''">
                                        <input id="SL-M" type="radio" name="orderType" label="SL-M" class="su-radio"
                                            value="SL-M" [(ngModel)]="margins.order_type"
                                            [disabled]="margins.variety === 'co'">
                                        <label for="SL-M" class="su-radio-label">SL-M</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>


                <footer class="footer d-flex">
                    <div class="seven columns">
                        <div class="row margins">
                            <div class="block">
                                <label>Margin</label>
                                <span class="value" data-balloon="Margin calculation explained" data-balloon-pos="up">₹2,00,891.44</span>
                            </div>
                            <div class="block charges">
                                <label>Charges</label> 
                                <span class="value" data-balloon="View charges &amp; taxes" data-balloon-pos="up">₹74.70</span> 
                                <span class="refresh-margins" data-balloon="Refresh"
                                    data-balloon-pos="up">
                                    <span class="reload-margin icon icon-reload"></span>
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="five columns text-right actions">
                        <button *ngIf="!isOrderModify" type="submit" class="submit"
                            (click)="openIntradayOrderPopup()"><span>{{margins.type |
                                titlecase}}</span></button>
                        <button *ngIf="isOrderModify" type="submit" class="submit"
                            (click)="modifyOrder()"><span>Modify</span></button>
                        <button type="button" class="button-outline cancel ml-1" (click)="closePopup()">Cancel</button>
                    </div>
                </footer>
            </div>
        </section>

    </form>
</div>
<div toastContainer></div>
