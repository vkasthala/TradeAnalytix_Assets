<div class="trade-risk-tabs">
    <div class="tab vertical-tabs" role="tabpanel">
        <ul class="nav nav-tabs v-tabs" role="tablist">
            <li class="active" role="presentation">
                <a aria-controls="profile" aria-expanded="false" data-toggle="tab" href="#Compliance" role="tab" (click)="getComplianceItems()">Performance by Compliance</a>
            </li>
            <li class="" role="presentation">
                <a aria-controls="profile" aria-expanded="false" data-toggle="tab" href="#PlannedTrades" role="tab" (click)="getPlannedTradesItems()">Performance by Planned Trades</a>
            </li> 
            <li class="" role="presentation">
                <a aria-controls="profile" aria-expanded="false" data-toggle="tab" href="#RulesCompliance" role="tab" (click)="getRulesComplianceItems()">Rules Compliance %</a>
            </li> 
        </ul>
        <div class="tab-content tabs">
            <div class="tab-pane active" id="Compliance" role="tabpanel">
                <div class="risk-manage-sec">
                    <div class="top-sec">
                        <div class="px-3">
                            Filter By Date
                        </div>
                        <div class="trade-date">
                            <div class="form-group">
                                <div class='input-group date' id='datetimepicker1'>
                                    <my-date-range-picker placeholder="Date range" name="mydaterange"
                                        [options]="myDateRangePickerOptions"></my-date-range-picker>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- cards -->
                    <app-reportsitems [reportsitems]="reportsitems"></app-reportsitems>

                    <!-- risk-nalytics -->
                    <div class="trade-dash-con">
                        <div class="trade-analytics">
                            <div class="trade-headiang">
                                <h5>Net Return and Win-Loss by Rules Compliance</h5>
                            </div>
                            <div class="dsh-img">
                                <img src="../../../../assets/images/risk/Group 305.png" alt="" class="img-fluid">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- end:  Compliance -->

            <div class="tab-pane fade" id="PlannedTrades" role="tabpanel">
                <div class="risk-manage-sec">
                    <div class="top-sec">
                        <div class="px-3">
                            Filter By Date
                        </div>
                        <div class="trade-date">
                            <div class="form-group">
                                <div class='input-group date' id='datetimepicker1'>
                                    <my-date-range-picker placeholder="Date range" name="mydaterange"
                                        [options]="myDateRangePickerOptions"></my-date-range-picker>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- cards -->
                    <app-reportsitems [reportsitems]="reportsitems"></app-reportsitems>

                    <!-- risk-nalytics -->
                    <div class="trade-dash-con">
                        <div class="trade-analytics">
                            <div class="trade-headiang">
                                <h5>Net Return and Win-Loss by Planned Trades</h5>
                            </div>
                            <div class="dsh-img">
                                <img src="../../../../assets/images/risk/Group 305.png" alt="" class="img-fluid">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- end:  Planned Trades -->
            <div class="tab-pane fade" id="RulesCompliance" role="tabpanel">
                <div class="risk-manage-sec">
                    <div class="top-sec">
                        <div class="px-3">
                            Filter By Date
                        </div>
                        <div class="trade-date">
                            <div class="form-group">
                                <div class='input-group date' id='datetimepicker1'>
                                    <my-date-range-picker placeholder="Date range" name="mydaterange"
                                        [options]="myDateRangePickerOptions"></my-date-range-picker>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- cards -->
                    <app-reportsitems [reportsitems]="reportsitems"></app-reportsitems>

                    <!-- risk-nalytics -->
                    <div class="trade-dash-con">
                        <div class="trade-analytics">
                            <div class="trade-headiang">
                                <h5>Entry and Exit Rules Compliance</h5>
                            </div>
                            <div class="dsh-img">
                                <img src="../../../../assets/images/risk/Group 305.png" alt="" class="img-fluid">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- end:  Rules Compliance -->

        </div>
    </div>
</div>
