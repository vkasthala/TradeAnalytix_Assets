<div class="trade-risk-tabs">
    <div class="tab vertical-tabs" role="tabpanel">
        <ul class="nav nav-tabs v-tabs" role="tablist">
            <li class="active" role="Allocation">
                <a aria-controls="Allocation" aria-expanded="false" data-toggle="tab" href="#Allocation" role="tab" (click)="getAllocationItems()">Allocation</a>
            </li>
            <li class="" role="Diversification">
                <a aria-controls="Diversification" aria-expanded="false" data-toggle="tab" href="#Diversification
                " role="tab" (click)="getDiversificationItems()">Diversification</a>
            </li>
        </ul>
        <div class="tab-content tabs">
            <div class="tab-pane active" id="Allocation" role="tabpanel">
                <div class="risk-manage-sec">
                    <div class="top-sec">
                        <div class="px-3">
                            Filter By Date
                        </div>
                        <div class="trade-date">
                            <div class="form-group">
                                <div class='input-group date' id='datetimepicker1'>
                                    <my-date-range-picker placeholder="Date range" name="mydaterange" [options]="myDateRangePickerOptions"></my-date-range-picker>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- cards -->
                    <app-reportsitems [reportsitems]="reportsitems"></app-reportsitems>

                    <!-- risk-nalytics -->
                    <div class="trade-dash-con">
                        <div class="trade-analytics">
                            <div class="trade-headiang">
                                <h5>Goal Status</h5>
                            </div>
                            <div class="dsh-img reports-chart">
                                <img src="../../../../assets/images/risk/Group 305.png" alt="" class="img-fluid">
                            </div>
                        </div>
                        <div class="trade-analytics">
                            <div class="trade-headiang">
                                <h5>Total Net Return & Win-Rate</h5>
                            </div>
                            <div class="dsh-img reports-chart">
                                <img src="../../../../assets/images/risk/Group 306.png" alt="" class="img-fluid">
                            </div>
                        </div>
                        <div class="trade-analytics">
                            <div class="trade-headiang">
                                <h5>Calendar Report</h5>
                            </div>
                            <div class="dsh-img reports-chart">
                                <img src="../../../../assets/images/risk/Group 306.png" alt="" class="img-fluid">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- end:  Overview -->

            <div class="tab-pane fade" id="Diversification" role="tabpanel">
                <div class="risk-manage-sec">
                    <div class="top-sec">
                        <div class="px-3">
                            Filter By Date
                        </div>
                        <div class="trade-date">
                            <div class="form-group">
                                <div class='input-group date' id='datetimepicker1'>
                                    <my-date-range-picker placeholder="Date range" name="mydaterange" [options]="myDateRangePickerOptions"></my-date-range-picker>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- cards -->
                    <app-reportsitems [reportsitems]="reportsitems"></app-reportsitems>

                    <!-- risk-nalytics -->
                    <div class="trade-dash-con">
                        <div class="trade-analytics">
                            <div class="trade-headiang">
                                <h5>Net Return by Strategy Type</h5>
                            </div>
                            <div class="dsh-img reports-chart">
                                <img src="../../../../assets/images/risk/Group 305.png" alt="" class="img-fluid">
                            </div>
                        </div>
                        <div class="trade-analytics">
                            <div class="trade-headiang">
                                <h5>Win/Loss by Strategy Type</h5>
                            </div>
                            <div class="dsh-img reports-chart">
                                <img src="../../../../assets/images/risk/Group 306.png" alt="" class="img-fluid">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- end:  Diversification -->
        </div>
    </div>
</div>
