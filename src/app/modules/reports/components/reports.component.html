<div class="reports-section px-3">
    <div class="main-body">
        <!-- risk-tabs -->
        <div class="trade-risk-tabs web-parent-reports">
            <div class="tab" role="tabpanel">
                <div class="d-flex justify-content-between align-items-center">
                    <ul class="nav nav-tabs" role="tablist">
                        <li class="active" role="presentation">
                            <a aria-controls="profile" aria-expanded="false" data-toggle="tab" href="#Metrics" role="tab">Metrics</a>
                        </li>
                        <li role="presentation">
                            <a aria-controls="profile" aria-expanded="false" data-toggle="tab" href="#Performance" role="tab" (click)="onTabSelect('performance')">Tradebook Reports</a>
                        </li>
                        <li class="" role="presentation">
                            <a aria-controls="Journal Reports" aria-expanded="false" data-toggle="tab" href="#RiskManagement" role="tab" (click)="onTabSelect('risk')">Journal Reports</a>
                        </li>                      
                        <!-- <li class="" role="presentation">
                            <a aria-controls="profile" aria-expanded="false" data-toggle="tab" href="#Rules" role="tab" (click)="onTabSelect('rules')">Trading Rules<img src="../../../../assets/images/beta-icon.png" class="beta-icon"/></a>
                        </li> -->
                        
                    </ul>
                    <!-- <a data-toggle="modal" data-target="#modal1" class="watch-video-sm cursor mr-3">Watch Video</a> -->
                    <div class="metrics-header px-3 pt-2">
                        <div class="d-flex align-items-center">
                            <label class="m-0">Choose the date range for which metrics are to be shown</label>
                            <span class="page-nav">
                                <a class="page-nav-item">1M</a>
                                <a class="page-nav-item">YTD</a>
                                <a class="page-nav-item">6M</a>
                                <a class="page-nav-item">1Y</a>
                            </span>
                            <div>
                                <my-date-range-picker placeholder="Date range" name="metricDate" [options]="metricDate" (dateRangeChanged)="onmetricDateChanged($event)"></my-date-range-picker>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="tab-content tabs">
                    <div class="tab-pane active" id="Metrics" role="tabpanel">
                        <app-metrics></app-metrics>
                    </div>
                    <div class="tab-pane" id="Performance" role="tabpanel">
                        <app-performance></app-performance>
                    </div>
                    <div class="tab-pane fade" id="RiskManagement" role="tabpanel">
                        <app-riskmanagement #riskReports></app-riskmanagement>
                    </div>
                    <!-- <div class="tab-pane fade" id="Rules" role="tabpanel" >
                        <app-reports-rules #rulesReports></app-reports-rules>
                     </div> -->
                </div>
            </div>
        </div>

        <!-- mobile-tabs -->
        <div class="mobile-parent-reports p-3">
            <select class="form-control" (change)="parentReportChange($event)" selected> 
                <option value="Portfolio">Holding Reports</option>
                <option value="Performance">Performance</option>
                <option value="Goals">Goals</option>
                <option value="RiskManagement">Risk Management</option>
                <option value="Rules">Trading Rules</option>
                <option value="Discipline">Discipline</option>
                <option value="Commissions">Commissions</option>
            </select>
            <div>
                <div [ngClass]="selectedParentReport === 'Portfolio' ? 'd-block' : 'd-none'">
                    <app-portfolio></app-portfolio>
                </div>
                <div [ngClass]="selectedParentReport === 'Performance' ? 'd-block' : 'd-none'">
                    <app-performance></app-performance>
                </div>
                <!-- <div [ngClass]="selectedParentReport === 'Goals' ? 'd-block' : 'd-none'">
                    <app-goals #GoalsReports></app-goals>
                </div> -->
                <div [ngClass]="selectedParentReport === 'RiskManagement' ? 'd-block' : 'd-none'">
                    <app-riskmanagement #riskReports></app-riskmanagement>
                </div>
                <div [ngClass]="selectedParentReport === 'Rules' ? 'd-block' : 'd-none'">
                    <app-reports-rules #rulesReports></app-reports-rules>
                 </div>
                <!-- <div [ngClass]="selectedParentReport === 'Discipline' ? 'd-block' : 'd-none'">
                    <app-discipline #disciplineReports></app-discipline>
                </div>
                <div [ngClass]="selectedParentReport === 'Commissions' ? 'd-block' : 'd-none'">
                    <app-commissions></app-commissions>
                </div> -->
            </div>
        </div>
    </div>
</div>
<div class="modal video-modal" id="modal1" tabindex="-1" role="dialog" aria-labelledby="modallabel1" aria-hidden= "true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="text-right px-2 pt-2">
                <span class="cursor" (click)="closePopup()" data-dismiss="modal"><mat-icon class="mat-icon-sm">clear</mat-icon></span>
            </div>
            <div class="modal-body px-2 py-0">
                <iframe width="100%" height="480" src="https://www.youtube.com/embed/oTOw-wUL1Jw" allowfullscreen></iframe>
            </div>
        </div>
    </div>
</div>
