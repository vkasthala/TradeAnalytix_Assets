<div class="reports-section px-3">
    <div class="main-body">
        <!-- risk-tabs -->
        <div class="trade-risk-tabs web-parent-reports">
            <div class="tab" role="tabpanel">
                
                <ul class="nav nav-tabs" role="tablist">
                    <li class="active" role="presentation">
                        <a aria-controls="profile" aria-expanded="false" data-toggle="tab" href="#Portfolio" role="tab">Portfolio</a>
                    </li>
                    <li class="" role="presentation">
                        <a aria-controls="profile" aria-expanded="false" data-toggle="tab" href="#Performance" role="tab" (click)="onTabSelect('performance')">Performance</a>
                    </li>
                    <li class="" role="presentation">
                        <a aria-controls="Goals" aria-expanded="false" data-toggle="tab" href="#Goals" role="tab" (click)="onTabSelect('goals')">Goals</a>
                    </li>
                    <li class="" role="presentation">
                        <a aria-controls="Risk Management" aria-expanded="false" data-toggle="tab" href="#RiskManagement" role="tab" (click)="onTabSelect('risk')">Risk Management</a>
                    </li>
                    <li class="" role="presentation">
                        <a aria-controls="profile" aria-expanded="false" data-toggle="tab" href="#Rules" role="tab" (click)="onTabSelect('rules')">Trading Rules</a>
                    </li>
                    <li class="" role="presentation">
                        <a aria-controls="profile" aria-expanded="false" data-toggle="tab" href="#Discipline" role="tab" (click)="onTabSelect('discipline')">Discipline</a>
                    </li>
                    
                    <li class="" role="presentation">
                        <a aria-controls="profile" aria-expanded="false" data-toggle="tab" href="#Commissions" role="tab">Commissions</a>
                    </li>
                </ul>
                <div class="tab-content tabs">
                    <div class="tab-pane active" id="Portfolio" role="tabpanel">
                        <app-portfolio></app-portfolio>
                    </div>
                    <div class="tab-pane" id="Performance" role="tabpanel">
                        <app-performance></app-performance>
                    </div>
                    <div class="tab-pane fade" id="Goals" role="tabpanel">
                        <app-goals #GoalsReports></app-goals>
                    </div>
                    <div class="tab-pane fade" id="RiskManagement" role="tabpanel">
                        <app-riskmanagement #riskReports></app-riskmanagement>
                    </div>
                    <div class="tab-pane fade" id="Rules" role="tabpanel" [ngClass]="selectedParentReport === 'Rules' ? 'd-block' : 'd-none'">
                        <app-reports-rules #rulesReports></app-reports-rules>
                     </div>
                    <div class="tab-pane fade" id="Discipline" role="tabpanel" [ngClass]="selectedParentReport === 'Discipline' ? 'd-block' : 'd-none'">
                        <app-discipline #disciplineReports></app-discipline>
                    </div>
                    <div class="tab-pane fade" id="Commissions" role="tabpanel" [ngClass]="selectedParentReport === 'Commissions' ? 'd-block' : 'd-none'">
                        <app-commissions></app-commissions>
                    </div>
                </div>
            </div>
        </div>

        <!-- mobile-tabs -->
        <div class="mobile-parent-reports p-3">
            <select class="form-control" (change)="parentReportChange($event)" selected> 
                <option value="Portfolio">Portfolio</option>
                <option value="Performance">Performance</option>
                <option value="Goals">Goals</option>
                <option value="RiskManagement">Risk Management</option>
                <option value="Rules">Trading Rules</option>
                <option value="Discipline">Discipline</option>
                <option value="Commissions">Commissions</option>
            </select>
            <div>
                <div [ngClass]="selectedParentReport === 'Portfolio' ? 'd-block' : 'd-none'">
                    <app-portfolio></app-portfolio>
                </div>
                <div [ngClass]="selectedParentReport === 'Performance' ? 'd-block' : 'd-none'">
                    <app-performance></app-performance>
                </div>
                <div [ngClass]="selectedParentReport === 'Goals' ? 'd-block' : 'd-none'">
                    <app-goals #GoalsReports></app-goals>
                </div>
                <div [ngClass]="selectedParentReport === 'RiskManagement' ? 'd-block' : 'd-none'">
                    <app-riskmanagement #riskReports></app-riskmanagement>
                </div>
                <div [ngClass]="selectedParentReport === 'Rules' ? 'd-block' : 'd-none'">
                    <app-reports-rules #rulesReports></app-reports-rules>
                 </div>
                <div [ngClass]="selectedParentReport === 'Discipline' ? 'd-block' : 'd-none'">
                    <app-discipline #disciplineReports></app-discipline>
                </div>
                <div [ngClass]="selectedParentReport === 'Commissions' ? 'd-block' : 'd-none'">
                    <app-commissions></app-commissions>
                </div>
            </div>
        </div>
    </div>
</div>
