<div class="trade-risk-tabs">
    <div class="tab vertical-tabs" role="tabpanel">
        <ul class="nav nav-tabs v-tabs" role="tablist">
            <li role="presentation" *ngFor="let type of reportSubTypes" [ngClass]="{'active': type.id === 'type'}">
                <a aria-controls="profile" aria-expanded="false" data-toggle="tab" href="#Overview" role="tab"
                    (click)="onReportSubTypeSelect(type)">{{type.name}}</a>
            </li>
        </ul>
        <div class="tab-content tabs">
            <div class="tab-pane active" id="Overview" role="tabpanel">
                <div class="risk-manage-sec">
                    <div class="top-sec">
                        <div class="px-3">
                            Filter By Date
                        </div>
                        <div class="trade-date">
                            <div class="form-group">
                                <div class='input-group date' id='datetimepicker1'>
                                    <my-date-range-picker placeholder="Date range" name="mydaterange"
                                        [options]="myDateRangePickerOptions" (dateRangeChanged)="onDateRangeChanged($event)" [(ngModel)]="dateFilter"></my-date-range-picker>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Summary -->
                    <!--<app-report-summary [reportSummaryItems]="reportSummaryItems" #reportSummary></app-report-summary>-->

                    <!-- charts -->
                    <div class="trade-dash-con">
                        <app-report-chart *ngFor="let report of reports" [report] = "report" [subtype] = "subtype" [reportFilter] = "reportFilter" [filterChangeSubject]="filterChangeSubject" #reportChart></app-report-chart>
                    </div>
                </div>
            </div>
            <!-- end:  Overview -->
        </div>
    </div>
</div>
