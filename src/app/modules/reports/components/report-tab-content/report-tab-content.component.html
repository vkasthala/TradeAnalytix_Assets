<div class="trade-risk-tabs child-tabs-container">
    <!-- mobile-tabs -->
    <div class="mobile-child-reports p-2">
        <select class="form-control" [(ngModel)]="selectedObject" (change)="onReportSubTypeSelect(selectedObject)">
            <option *ngFor="let type of reportSubTypes;let i = index" [ngValue]="type" [selected]="type.id === 'allocation'">{{type.name}}</option>
        </select>
    </div>
    <div class="tab vertical-tabs" role="tabpanel">
        <ul class="nav nav-tabs v-tabs web-child-reports" role="tablist">
            <li role="presentation" *ngFor="let type of reportSubTypes" [ngClass]="{'active': type.id === 'allocation'}">
                <a aria-controls="profile" aria-expanded="false" data-toggle="tab" href="#allocation" role="tab" (click)="onReportSubTypeSelect(type)">{{type.name}}</a>
            </li>
        </ul>

        
        <div class="tab-content tabs">
            <div class="tab-pane active" id="allocation" role="tabpanel">
                <div class="risk-manage-sec">
                    <div class="top-sec">
                        <div class="px-3 top-sec-label" *ngIf="type === 'performance'">
                            Symbol
                        </div>
                        <div class="report-trade-symbol" *ngIf="type === 'performance'">
                            <div class="form-group has-search">
                                <app-trade-search (symbolSelectEvent)="symbolSelectEventHandler($event)" #tradeSearchComponent>
                                </app-trade-search>
                                <mat-icon class="form-icon-down" (click)="onClearSymbol()">clear</mat-icon>
                            </div>
                        </div>
                        <div class="px-3 top-sec-label">
                            Date Range
                        </div>
                        <div class="trade-date">
                            <div class="form-group m-0">
                                <div class='input-group date' id='datetimepicker1'>
                                    <my-date-range-picker placeholder="Date range" name="mydaterange" [options]="myDateRangePickerOptions" (dateRangeChanged)="onDateRangeChanged($event)" [(ngModel)]="dateFilter"></my-date-range-picker>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row row_reverse">
                        <!-- Summary -->
                        <div class="col-sm-4">
                            <app-report-summary [reportFilter]="reportFilter" [subtype]="subtype" [filterChangeSubject]="filterChangeSubject" [reportTypeChangeSubject]="reportTypeChangeSubject" #reportSummary></app-report-summary>
                        </div>

                        <div class="col-sm-8">
                            <!-- charts -->
                            <div class="trade-dash-con" *ngFor="let report of reports">
                                <app-report-chart [report]="report" [subtype]="subtype" [reportFilter]="reportFilter" [description]="description" [filterChangeSubject]="filterChangeSubject" #reportChart></app-report-chart>
                            </div>
                            <div *ngIf="!reports || reports.length == 0" class="lbl-coming-soon">Coming Soon</div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- end:  Overview -->
        </div>
    </div>
</div>
