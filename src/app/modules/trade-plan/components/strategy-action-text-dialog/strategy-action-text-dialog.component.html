<div class="compare-popup">
    <div class="compare-pop-inner">
        <div class="top-pop-inner">
            <div class="left-heading">
                <h6>{{title}}</h6>
            </div>
            <div class="right-close" (click)="closeModal()">
                <mat-icon>clear</mat-icon>
            </div>
        </div>

        <div class="main-pop-inner">
            <div class="pb-1">
                <textarea rows="2" class="form-control" [(ngModel)]="data.actionText"></textarea>
            </div>

            <div class="btn-up mb-0">
                <button type="button" class="btn btn-add" [mat-dialog-close]="data">SAVE</button>
            </div>
        </div>

    </div>
</div>
