<div class="dark-theme-body">
  <div class="container px-2">
    <div class="trade-plan-section">
      <div class="trade-strategies-table">
        <div class="card main-body">
          <div class="trade-dash-main">
            <div class="trade-dash-name">
              <h3>Trade Plans</h3>
              
            </div>
            <div class="trade_plans_header">
              <span class="col-form-label mr-2">Filter By</span>
                <div class="trade-date mr-3">
                  <div class="form-group">
                    <div class='input-group date' id='datetimepicker1'>
                        <my-date-range-picker placeholder="Date range" name="mydaterange" [options]="myDateRangePickerOptions"></my-date-range-picker>
                    </div>
                  </div>
                </div>
              <button class="add-new btn btn-apply" (click)="addEntry()"> New Plan</button>
            </div>
          </div>

          <div class="card-body">
            <div class="mat-elevation-z8">
              <table mat-table [dataSource]="dataSource">
                <!-- Position Column -->
                <ng-container matColumnDef="date">
                  <th mat-header-cell *matHeaderCellDef> Date </th>
                  <td mat-cell *matCellDef="let element"> {{element.date}} </td>
                </ng-container>

                <!-- Status Column -->
                <ng-container matColumnDef="status">
                  <th mat-header-cell *matHeaderCellDef> Status </th>
                  <td mat-cell *matCellDef="let element" [ngClass]="{
                    'text-primary': element.status == 'Open',
                    'text-success': element.status == 'Closed'}"> {{element.status}} </td>
                </ng-container>

                <!-- Mindset Column -->
                <ng-container matColumnDef="mindset">
                  <th mat-header-cell *matHeaderCellDef> Mindset </th>
                  <td mat-cell *matCellDef="let element"> {{element.mindset}} </td>
                </ng-container>
            
                <!-- Name Column -->
                <ng-container matColumnDef="prediction">
                  <th mat-header-cell *matHeaderCellDef width ="15%"> Prediction</th>
                  <td mat-cell *matCellDef="let element"> {{element.prediction}} </td>
                </ng-container>
            
                
                <!-- Symbol Column -->
                <ng-container matColumnDef="planned_trades">
                  <th mat-header-cell *matHeaderCellDef> Planned Trades </th>
                  <td mat-cell *matCellDef="let element"> {{element.planned_trades}} </td>
                </ng-container>

                <!-- Lessions Learnt Column -->
                <ng-container matColumnDef="aligned">
                  <th mat-header-cell *matHeaderCellDef> Aligned</th>
                  <td mat-cell *matCellDef="let element" [ngClass]="{
                    'text-success': element.aligned == 'Yes',
                    'text-danger': element.aligned == 'No'}">{{element.aligned}}</td>
                </ng-container>

                <!-- Lessions Learnt Column -->
                <ng-container matColumnDef="self_review">
                  <th mat-header-cell *matHeaderCellDef>Self-Review</th>
                  <td mat-cell *matCellDef="let element"> {{element.self_review}} </td>
                </ng-container>

                <!-- Lessions Learnt Column -->
                <ng-container matColumnDef="trades">
                  <th mat-header-cell *matHeaderCellDef>Trades</th>
                  <td mat-cell *matCellDef="let element"> {{element.trades}} </td>
                </ng-container>

                <!-- Lessions Learnt Column -->
                <ng-container matColumnDef="return">
                  <th mat-header-cell *matHeaderCellDef>Return</th>
                  <td mat-cell *matCellDef="let element"> {{element.return}} </td>
                </ng-container>

                <!-- Action Column -->
                <ng-container matColumnDef="action">
                  <th mat-header-cell *matHeaderCellDef> </th>
                  <td mat-cell *matCellDef="let element"><div class="edit">
                    

                    <mat-icon class="text-success cursor mat-icon-sm" (click)="editEntry()">edit</mat-icon>
                </div>

              </td>
                </ng-container>
            
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
              </table>
              <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 20]" [showFirstLastButtons]="true"
              [length]="dataSource.totalCount"></mat-paginator>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
