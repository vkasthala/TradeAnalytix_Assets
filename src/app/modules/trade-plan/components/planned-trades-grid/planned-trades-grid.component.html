<div class="mb-2">
    <label class="col-form-label pt-0">What do you plan to trade today?</label>
    <div class="px-0">
        <mat-table [dataSource]="plannedTradesDataSource">
            <ng-container matColumnDef="symbol">
                <th mat-header-cell *matHeaderCellDef>Symbol</th>
                <td mat-cell *matCellDef="let element"> {{element.symbol}} </td>
            </ng-container>

            <ng-container matColumnDef="strategyType">
                <th mat-header-cell *matHeaderCellDef>Strategy Type</th>
                <td mat-cell *matCellDef="let element"> {{element.strategyType}} </td>
            </ng-container>

            <ng-container matColumnDef="actionType">
                <th mat-header-cell *matHeaderCellDef>Action</th>
                <td mat-cell *matCellDef="let element"> {{element.actionType}} </td>
            </ng-container>

            <ng-container matColumnDef="maxRisk">
                <th mat-header-cell *matHeaderCellDef>Max Risk</th>
                <td mat-cell *matCellDef="let element"> {{element.maxRisk}} </td>
            </ng-container>

            <ng-container matColumnDef="profit">
                <th mat-header-cell *matHeaderCellDef>Profit</th>
                <td mat-cell *matCellDef="let element"> {{element.profit}} </td>
            </ng-container>

            <ng-container matColumnDef="reason">
                <th mat-header-cell *matHeaderCellDef>Specify reasons for the trade</th>
                <td mat-cell *matCellDef="let element"> {{element.reason}} </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="plannedTradesGridColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: plannedTradesGridColumns;"></tr>
        </mat-table>
    </div>
</div>
