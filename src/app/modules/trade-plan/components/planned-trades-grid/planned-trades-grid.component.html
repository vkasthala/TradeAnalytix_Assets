<div class="mb-2">
    <div class="col-12 px-0 d-flex justify-content-between mb-1">
        <label class="col-form-label pt-0 px-3">What do you plan to trade today?</label>
        <!-- <mat-icon class="text-primary mat-icon-md add-icon cursor" (click)="openPlannedTradeDialog()">add_circle</mat-icon> -->
    </div>
    <div class="d-flex">
        <mat-table [dataSource]="plannedTradesDataSource">
            <ng-container matColumnDef="symbol">
                <th mat-header-cell *matHeaderCellDef class="symbol-cell">Symbol</th>
                <td mat-cell *matCellDef="let element"> {{element.symbol}} </td>
            </ng-container>

            <ng-container matColumnDef="strategyType">
                <th mat-header-cell *matHeaderCellDef>Strategy Type</th>
                <td mat-cell *matCellDef="let element"> {{element.strategyType}} </td>
            </ng-container>

            <ng-container matColumnDef="actionType">
                <th mat-header-cell *matHeaderCellDef>Buy to Open</th>
                <td mat-cell *matCellDef="let element"> {{element.actionType}} </td>
            </ng-container>

            <ng-container matColumnDef="maxRisk">
                <th mat-header-cell *matHeaderCellDef>Max Risk</th>
                <td mat-cell *matCellDef="let element"> {{element.maxRisk | number:'1.0-0'}} </td>
            </ng-container>

            <ng-container matColumnDef="profit">
                <th mat-header-cell *matHeaderCellDef>Expected Profit</th>
                <td mat-cell *matCellDef="let element"> {{element.profit | number:'1.0-0'}} </td>
            </ng-container>

            <ng-container matColumnDef="reason">
                <th mat-header-cell *matHeaderCellDef class="justification-cell">Justification</th>
                <td mat-cell *matCellDef="let element"> {{element.reason}} </td>
            </ng-container>

            <ng-container matColumnDef="executed" *ngIf="tradePlanId > 0">
                <th mat-header-cell *matHeaderCellDef>Executed</th>
                <td mat-cell *matCellDef="let element">
                    <mat-checkbox [(ngModel)]="element.executed"></mat-checkbox>
                </td>
            </ng-container>
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>
                    <span class="d-flex align-items-center">
                        Actions
                        <mat-icon class="text-primary mat-icon-md cursor ml-3" (click)="openPlannedTradeDialog()">add_circle</mat-icon>
                    </span>
                </th>
                <td mat-cell *matCellDef="let element; let i = index;"> <span></span>
                    <mat-icon class="mat-icon-edit mat-icon-sm" (click)="openPlannedTradeDialog(element, i)">edit
                    </mat-icon>

                    <mat-icon class="mat-icon-sm mat-icon-sm ml-2" (click)="deletePlannedTrade(i)">delete
                    </mat-icon>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="plannedTradesGridColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: plannedTradesGridColumns;"></tr>
        </mat-table>
    </div>
</div>
