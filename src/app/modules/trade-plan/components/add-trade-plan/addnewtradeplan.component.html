<div class="d-flex justify-content-end px-3 pb-2">
    <div class="trade-plan-date mr-2">
        <div class="datepicker-group">
            <input matInput [matDatepicker]="tradePlanDate" 
            [(ngModel)]="planDate"
            placeholder="Date"
            (dateInput)="addEvent('input', $event)"
            id="tradePlanDate" (dateChange)="addEvent('change', $event)">
            <mat-datepicker-toggle matSuffix [for]="tradePlanDate"></mat-datepicker-toggle>
            <mat-datepicker #tradePlanDate>
            </mat-datepicker>
        </div>
    </div>
    <button class="btn new-plan d-flex align-items-center" (click)="addTradePlanDate()">New Plan</button>
</div>

<div class="card-body pt-0 px-3">
    <div class="row">
        <div class="col-sm-2 trade-plan-lt">
            <div class="date-filter-list" *ngIf="planDates.length > 0">
                <div class="date-filter-header">
                    <h3 class="title">Date</h3>
                    <span class="cursor" (click)="mydaterangeOpen()"><img src="../../../../assets/images/filter-black.png" /></span>
                </div>
                <div *ngIf="showMmydaterange" class="trade-date date-range-sm px-1">
                    <my-date-range-picker placeholder="Date range" id="mydaterange" name="mydaterange" [options]="myDateRangePickerOptions" (dateRangeChanged)="onDateRangeChanged($event)"></my-date-range-picker>
                </div>
                <ul *ngFor="let date of planDates; let index = index">
                    <li [ngClass]="(selectedPlan && selectedPlan.id === date.id) ? 'active' : '' " (click) = "onPlanSelect(date)">{{date.day | date: 'dd-MMM-yyyy'}}</li>
                </ul>
            </div>
        </div>
        <div class="col-sm-10 pl-0 trade-plan-rt" *ngIf = "selectedPlan">
            <div class="trade-plan-container pb-1 mb-3">
                <mat-accordion class="trade-plan-accordion w-100" multi="true">
                    <mat-expansion-panel [expanded]="true">
                        <mat-expansion-panel-header>
                            <mat-panel-title>
                                Pre-Market
                            </mat-panel-title>
                        </mat-expansion-panel-header>
                        <ng-template matExpansionPanelContent>
                            <div class="row mb-3 pb-2">
                                <div class="col-sm-6">
                                    <div class="trade-plan-header justify-content-between">
                                        <span>Notes</span>
                                        <a class="add-new" (click)="openEconomicModal()">Economic Calendar</a>
                                    </div>
                                    <div>
                                        <textarea placeholder="Write about your trading performance and lessons learnt during the day" class="textarea-lg"  [(ngModel)]="tradePlan.perspective" (blur)="updateTradePlan()"></textarea>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="trade-plan-header">
                                        Holdings
                                    </div>
                                    <app-open-strategies-grid [selectedPlan]="selectedPlan" #openStrategiesGrid></app-open-strategies-grid>
                                </div>
                            </div>
                            <app-planned-trades-grid [selectedPlan]="selectedPlan" #plannedTradesGrid></app-planned-trades-grid>
                        </ng-template>
                    </mat-expansion-panel>
                </mat-accordion>
            </div>

            <div class="trade-plan-container pb-1">
                <mat-accordion class="trade-plan-accordion w-100" multi="true">
                    <mat-expansion-panel [expanded]="true">
                        <mat-expansion-panel-header>
                            <mat-panel-title>
                                Post-Market
                            </mat-panel-title>
                        </mat-expansion-panel-header>
                        <ng-template matExpansionPanelContent>
                            <div class="row">
                                <div class="col-sm-6">
                                    <div class="trade-plan-header justify-content-between">
                                        <span>Notes</span>
                                    </div>
                                    <div>
                                        <textarea placeholder="Write about your trading performance and lessons learnt during the day" class="textarea-lg" [(ngModel)]="tradePlan.lessons" (blur)="updateTradePlan()"></textarea>
                                    </div>
                                    <div class="text-right">
                                        <a class="add-new cursor" (click)="addEntryExitRule('Add', 'SAVE')">Add Rule</a>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="trade-plan-header">
                                        Executed Trades
                                    </div>

                                    <app-today-executed-legs [selectedPlan]="selectedPlan" #todayExcutedTradesGrid></app-today-executed-legs>
                                    
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-sm-4">
                                    <label class="col-form-label">Rate your trading performance</label>
                                    <div class="col-md-6 px-0">
                                        <select class="form-control" [(ngModel)]="tradePlan.selfReview" (ngModelChange)="updateTradePlan()">
                                            <option value="good">Good</option>
                                            <option value="average">Average</option>
                                            <option value="bad">Bad</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-sm-4">
                                    <span class="d-flex align-items-center">
                                        <label class="col-form-label mr-3">Did you align with your trading plan?</label>
                                        <label class="toggle m-0">
                                            <input type="checkbox" id="tradingToggle" class="cursor" [checked]="tradePlan.tradeplanAligned" [(ngModel)]="tradePlan.tradeplanAligned" (ngModelChange)="updateTradePlan()">
                                            <span class="slider"></span>
                                            <span class="labels" data-on="Yes" data-off="No"></span>
                                        </label>
                                    </span>
                                    <!-- <div class="col-md-6 px-0">
                                        <select class="form-control">
                                            <option value="0">Good</option>
                                        </select>
                                    </div> -->
                                </div>
                            </div>
                            <div class="py-3">
                                <app-dailystatistics [selectedPlan]="selectedPlan" #dailyPlanStats></app-dailystatistics>
                            </div>
                        </ng-template>
                    </mat-expansion-panel>
                </mat-accordion>
            </div>
        </div>
    </div>
</div>
