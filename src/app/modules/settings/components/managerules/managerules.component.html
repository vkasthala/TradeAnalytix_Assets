<div class="container">
    <div class="trade-st-box">
        <label class="m-0">Filter By</label>
        <div class="px-2">
            <select class="form-control" id="exampleFormControlSelect1">
                <option value="1">Source</option>
                <option value="2">Draft</option>
                <option value="3">Open</option>
                <option value="4">Closed</option>
                <option value="5">Expired</option>
            </select>
        </div>
        <a class="add-new" (click)="addRule('Add', 'SAVE')">
            <mat-icon class="mat-icon-sm text-success">add_circle</mat-icon>
            ADD RULE
        </a>
    </div>

    <div class="trade-strategies-table">
        <div class="trade-table">
            <mat-table [dataSource]="dataSource" matSort>
              <!-- Position Column -->
              <ng-container matColumnDef="date">
                <mat-header-cell class="date-cell" *matHeaderCellDef> Date </mat-header-cell>
                <mat-cell *matCellDef="let element"> {{element.date}} </mat-cell>
              </ng-container>
          
              <!-- Name Column -->
              <ng-container matColumnDef="type">
                <mat-header-cell class="type-cell" *matHeaderCellDef> Type</mat-header-cell>
                <mat-cell *matCellDef="let element" class="type-cell"> {{element.type}} </mat-cell>
              </ng-container>
          
              <!-- Weight Column -->
              <ng-container matColumnDef="description">
                <mat-header-cell class="description-cell" *matHeaderCellDef> Description</mat-header-cell>
                <mat-cell *matCellDef="let element" class="description-cell"> {{element.description}} </mat-cell>
              </ng-container>
          
              <!-- Symbol Column -->
              <ng-container matColumnDef="source">
                <mat-header-cell class="source-cell" *matHeaderCellDef> Source </mat-header-cell>
                <mat-cell class="source-cell" *matCellDef="let element"> {{element.source}} </mat-cell>
              </ng-container>
              
              <!-- Action Column -->
              <ng-container matColumnDef="action">
                <mat-header-cell class="action-cell" *matHeaderCellDef> Action</mat-header-cell>
                <mat-cell *matCellDef="let element" class="action-cell">
                    <mat-icon class="text-success mat-icon-sm cursor" (click)="editTrade(element, 'Edit', 'Update')">edit</mat-icon>
                    <mat-icon class="mat-icon-sm cursor ml-2">delete</mat-icon>
                </mat-cell>
              </ng-container>
          
              <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
              <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
            </mat-table>
            <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 20]" [showFirstLastButtons]="true"
            [length]="dataSource.totalCount"></mat-paginator>
          </div>
    </div>
</div>
