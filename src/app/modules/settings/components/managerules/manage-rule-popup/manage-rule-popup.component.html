<!-- manage-rules-popup -->
<div class="compare-popup">
    <div class="compare-pop-inner">
        <div class="top-pop-inner">
            <div class="left-heading">
                <h6>{{title}} Rule</h6>
            </div>
            <div class="right-close" (click)="closeModal()">
                <mat-icon>clear</mat-icon>
            </div>
        </div>

        <div class="main-pop-inner">
            <div class="row mb-2">
                <label class="col-12 col-form-label">Rule Type</label>
                <div class="col-8">
                    <select class="form-control" id="exampleFormControlSelect1" [(ngModel)]="rowData.type">
                        <option>Entry</option>
                        <option>Exit</option>
                    </select>
                </div>
            </div>

            <div class="mb-2">
                <label class="col-form-label">Description</label>
                <textarea class="form-control" id="exampleFormControlTextarea1" rows="3">{{rowData.description}}</textarea>
            </div>
            <div class="row mb-2">
                <label class="col-12 col-form-label">Source</label>
                <div class="col-8 has-search">
                    <input class="form-control" placeholder="" type="text" [(ngModel)]="rowData.source" />
                </div>
            </div>
            <div class="separator"></div>

            <div class="btn-up mb-0">
                <button type="button" class="btn btn-save" (click)="closeModal()">{{btnText}}</button>
            </div>
        </div>
    </div>
</div>
