<mat-accordion class="example-headers-align w-100" multi="true">
    <mat-expansion-panel [expanded]="true" (opened)="setStep(0)">
        <mat-expansion-panel-header>
            <mat-panel-title>
                Source of Trade Ideas
            </mat-panel-title>
        </mat-expansion-panel-header>
        <ng-template matExpansionPanelContent>
            <app-editable-list #tradeIdea></app-editable-list>
        </ng-template>
    </mat-expansion-panel>

    <mat-expansion-panel [expanded]="true" (opened)="setStep(1)">
        <mat-expansion-panel-header>
            <mat-panel-title>
                Technical Indicators
            </mat-panel-title>
        </mat-expansion-panel-header>
        <ng-template matExpansionPanelContent>
            <app-editable-list #technicalIndicator></app-editable-list>
        </ng-template>
    </mat-expansion-panel>

    <mat-expansion-panel [expanded]="true" (opened)="setStep(2)">
        <mat-expansion-panel-header>
            <mat-panel-title>
                Mindset
            </mat-panel-title>
        </mat-expansion-panel-header>
        <ng-template matExpansionPanelContent>
            <app-editable-list #mindSetType></app-editable-list>
        </ng-template>
    </mat-expansion-panel>
    <mat-expansion-panel [expanded]="true" (opened)="setStep(3)">
        <mat-expansion-panel-header>
            <mat-panel-title>
                Events
            </mat-panel-title>
        </mat-expansion-panel-header>
        <ng-template matExpansionPanelContent>
            <app-editable-list #event></app-editable-list>
        </ng-template>
    </mat-expansion-panel>
    <mat-expansion-panel [expanded]="true" (opened)="setStep(4)">
        <mat-expansion-panel-header>
            <mat-panel-title>
                Trigger for Closing
            </mat-panel-title>
        </mat-expansion-panel-header>
        <ng-template matExpansionPanelContent>
            <app-editable-list #triggerClosing></app-editable-list>
        </ng-template>
    </mat-expansion-panel>
    <mat-expansion-panel [expanded]="true" (opened)="setStep(5)">
        <mat-expansion-panel-header>
            <mat-panel-title>
                Gain or Loss Attribution
            </mat-panel-title>
        </mat-expansion-panel-header>
        <ng-template matExpansionPanelContent>
            <app-editable-list #gainOrLossAttribution></app-editable-list>
        </ng-template>
    </mat-expansion-panel>
    <mat-expansion-panel [expanded]="true" (opened)="setStep(6)">
        <mat-expansion-panel-header>
            <mat-panel-title>
                Pre-Market Activities
            </mat-panel-title>
        </mat-expansion-panel-header>
        <ng-template matExpansionPanelContent>
            <div class="row align-items-end">
                <div class="col-sm-8 col-md-5">
                    <textarea id="preMarketActivities" rows="4"></textarea>
                </div>
                <div class="col-sm-4">
                    <button type="button" class="btn add-new">Submit</button>
                </div>
            </div>
        </ng-template>
    </mat-expansion-panel>
    <mat-expansion-panel [expanded]="true" (opened)="setStep(7)">
        <mat-expansion-panel-header>
            <mat-panel-title>
                Brokerage Commission
            </mat-panel-title>
        </mat-expansion-panel-header>
        <ng-template matExpansionPanelContent>
            <div class="col-sm-8 col-md-7 px-0">
                <app-editable-grid #brokerageCommissions></app-editable-grid>
            </div>
        </ng-template>
    </mat-expansion-panel>
</mat-accordion>
