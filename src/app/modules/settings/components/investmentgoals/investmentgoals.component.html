<div class="p-3">
    <div class="mb-2">
        <label class="col-form-label">Specify the maximum amount you are willing to risk to achieve your investment goals.</label>
        <div class="col-md-6 col-lg-3 p-0">
            <input type="text" class="form-control"  />
        </div>
    </div>
    <div class="mb-2">
        <label class="col-form-label">What percentage of total capital would you like to keep as cash?</label>
        <div class="col-md-6 col-lg-3 p-0">
            <input type="text" class="form-control"  />
        </div>
    </div>
    
    
    <div class="mb-2">
        <label class="col-form-label">Specify your investment goals for a given date range.</label>
        <div class="trade-cards-section">
            <span class="card-main">
                <div class="datepicker-group">
                    <input matInput [matDatepicker]="executed_date" (click)="executed_date.open()" id="executed_date"
                      (dateChange)="addEvent('input', $event)" name="executed_date" [(ngModel)]="executedDate" placeholder="Entry Date" />
                    <mat-datepicker-toggle matSuffix [for]="executed_date"></mat-datepicker-toggle>
                    <mat-datepicker #executed_date></mat-datepicker>
                  </div>
            </span>
            <span class="card-main card-main-lg">
                <div class='input-group date' id='datetimepicker1'>
                    <my-date-range-picker placeholder="Target Date range" name="mydaterange"
                        [options]="myDateRangePickerOptions"></my-date-range-picker>
                </div>
            </span>
            <span class="card-main"><input type="text" class="form-control" placeholder="Target Profile" /></span>
            <span class="text-primary"><mat-icon class="mt-2">add</mat-icon></span>
        </div>
        <div class="d-flex align-items-center mb-1">
            <span class="card-main pl-3">01-Jan-2020</span>
            <span class="card-main card-main-lg pl-3">01-Jan-20 to 31-Mar-20</span>
            <span class="card-main pl-3">10,000</span>
            <span class="text-primary">
                <mat-icon class="mr-3">edit</mat-icon>
                <mat-icon>delete</mat-icon>
            </span>
        </div>
        <div class="d-flex align-items-center mb-1">
            <span class="card-main pl-3">01-Jan-2020</span>
            <span class="card-main card-main-lg pl-3">01-Jan-20 to 31-Mar-20</span>
            <span class="card-main pl-3">10,000</span>
            <span class="text-primary">
                <mat-icon class="mr-3">edit</mat-icon>
                <mat-icon>delete</mat-icon>
            </span>
        </div>
        <div class="d-flex align-items-center mb-1">
            <span class="card-main pl-3">01-Jan-2020</span>
            <span class="card-main card-main-lg pl-3">01-Jan-20 to 31-Mar-20</span>
            <span class="card-main pl-3">10,000</span>
            <span class="text-primary">
                <mat-icon class="mr-3">edit</mat-icon>
                <mat-icon>delete</mat-icon>
            </span>
        </div>
        <div class="d-flex align-items-center mb-1">
            <span class="card-main pl-3">01-Jan-2020</span>
            <span class="card-main card-main-lg pl-3">01-Jan-20 to 31-Mar-20</span>
            <span class="card-main v">10,000</span>
            <span class="text-primary">
                <mat-icon class="mr-3">edit</mat-icon>
                <mat-icon>delete</mat-icon>
            </span>
        </div>
    </div>
</div>

<div class="trade-btn py-3">
    <div class="btn btn-apply" (click)="saveprofile()">
        SAVE
    </div>
</div>
