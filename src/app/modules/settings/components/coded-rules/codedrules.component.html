<mat-accordion class="example-headers-align w-100" multi="true">
    <mat-expansion-panel class="coded_rules_body pt-3" [expanded]="true" (opened)="setStep(0)">
        <ng-template matExpansionPanelContent>
            <div class="px-2 h6">Review and update the coded rules listed below to receive notifications automatically
                once the conditions are met.</div>
            <div class="d-flex py-2 align-items-center" *ngFor="let coderule of userCodedRules">
                <span class="px-2 pr-3">
                    <input type="checkbox" name="rule" class="checkbox mt-2"
                        [checked]="coderule.id && coderule.id !== null && coderule.id > 0" />
                </span>
                <span class="code-label">
                    {{coderule.uiLabel}}
                </span>
                <span class="px-2" *ngIf="!coderule.editing">
                    {{coderule.val ? coderule.val : coderule.defaultValue}}
                </span>
                <span class="px-1 d-flex align-items-center" *ngIf="coderule.editing">
                    <input type="text" class="form-control col-5" [(ngModel)]="coderule.tempVal" id="{{coderule.id}}" />
                    <mat-icon class="ml-2 mat-icon-edit action-icon" (click)="onItemEdit(coderule)">check_circle
                    </mat-icon>
                    <mat-icon class="ml-2 text-danger action-icon" (click)="onCancel(coderule)">close</mat-icon>
                </span>
                <mat-icon class="mat-icon-sm mat-icon-edit" (click)="onRowEdit(coderule)"
                    *ngIf="!coderule.editing && coderule.id">edit</mat-icon>
            </div>

            <!-- <div class="col-sm-8 col-md-6 mt-3">
                <app-editable-grid #codedRules></app-editable-grid>
            </div> -->
        </ng-template>
    </mat-expansion-panel>
</mat-accordion>
