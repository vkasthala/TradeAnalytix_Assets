<div class="trade-form">
    <div class="pb-3">
        <div class="row">
            <div class="py-2 col-sm-8">
                 <!-- <label class="col-form-label">Select Your Broker and Import Trades</label> -->
                 <!-- <select class="form-control" [(ngModel)]="selectedbroker" (change)="onBrokerageChange($event.target.value, index)">
                    <option *ngFor="let item of brokerages;let index = index" value={{item.id}}>{{item.name}}
                    </option>
                </select>  -->
                <!-- <mr-ngx-plaid-link-button env="development" [token]="plaidToken" (Success)="onPlaidSuccess($event)" (Exit)="onPlaidExit($event)" (Load)="onPlaidLoad($event)" (Event)="onPlaidEvent($event)" className="plaid-button" buttonText="Link Account" (Click)="onPlaidClick($event)"></mr-ngx-plaid-link-button> -->
            </div>
             <div class="py-2 col-sm-8"> 
                <label for="startDate">Start Date:</label> 
                <input type="date" id="startDate" name="startDate" [(ngModel)]="startDate"> 
                <label for="endDate">End Date:</label> 
                <input type="date" id="endDate" name="endDate" [(ngModel)]="endDate">
                 <button class="btn btn-enter btn-sm" 
                (click)="importSnapTradesByDate()">ImportSnapTradeBydate</button>
            </div>
            <div class="pt-2 col-sm-6">
                <button class="btn btn-enter btn-sm" [disabled]="!selectedBrokerage"
                    (click)="importTrades()">Import Trades</button>
                <mat-spinner [diameter]="30" *ngIf="processing"></mat-spinner>
            </div>
            <div class="popup" *ngIf="showPopup">
                <div class="popup-content">
                  <span class="close" (click)="closePopup()">&times;</span>
                  <pre>{{ jsonData | json }}</pre>
                </div>
              </div>
        </div>
    </div>
</div>
