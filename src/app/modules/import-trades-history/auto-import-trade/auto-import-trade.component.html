<div class="trade-form">
    <div class="pb-3">
        <div class="symbol-description pb-1">Seamlessly connect your brokerage account to CueTrade using Plaid. Simply log into your account to establish the link.</div>
        <div class="d-flex align-items-center auto-import-container" *ngIf="plaidToken !== ''">
            <mr-ngx-plaid-link-button env="development" [token]="plaidToken" (Success)="onPlaidSuccess($event)" (Exit)="onPlaidExit($event)" (Load)="onPlaidLoad($event)" (Event)="onPlaidEvent($event)" className="plaid-button" buttonText="Link Account" (Click)="onPlaidClick($event)"></mr-ngx-plaid-link-button>
            <span class="ml-3 cursor-text blue-link" [routerLink]="">List of brokerages supported</span>
        </div>
    </div>
</div>
