<div class="import-trade-popup">
    <div class="import-trade-pop-inner">
        <div class="popup-body">
            <div class="top-pop-inner">
                <div class="right-close" (click)="closeModal()">
                    <mat-icon>clear</mat-icon>
                </div>
            </div>
            <div class="trade-form">
                <h2 class="py-2 symbol-heading">Import Trades</h2>
                <div class="pb-2 symbol-description">Select your brokerage and import trade history</div>
                <div class="row">
                    <div class="py-2 col-sm-8">
                        <label class="col-form-label">Select Brokerage</label>
                        <select class="form-control" [(ngModel)]="selectedbroker" (change)="onBrokerageChange($event.target.value, index)">
                            <option *ngFor="let item of brokerages;let index = index" value={{item.id}}>{{item.name}}
                            </option>
                        </select>
                        <button (click)="linkPlaidAccount()">Link Account</button>
                    </div>
                    <div class="pt-2 col-sm-6">
                        <button class="btn btn-enter btn-sm" [disabled]="!selectedBrokerage"
                            (click)="importTrades()">Import</button>
                        <mat-spinner [diameter]="30" *ngIf="processing"></mat-spinner>
                    </div>
                </div>
