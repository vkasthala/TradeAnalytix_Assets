<div class="p-3 mt-1">
    <div class="main-body">
        <div class="pb-3 text-right">
            <button type="button" (click)="importTradesPopup();" class="btn btn-apply">Import Trades</button>
        </div>

        <div class="trade-table">
            <mat-table [dataSource]="dataSource" matSort>
                <!-- Date Column -->
                <ng-container matColumnDef="openDate">
                    <mat-header-cell *matHeaderCellDef mat-sort-header>Date</mat-header-cell>
                    <mat-cell class="strategy-id-cell" *matCellDef="let element"> {{element.createDateTime | date: 'dd-MMM-yyyy'}} </mat-cell>
                </ng-container>

                <!-- File name Column -->
                <ng-container matColumnDef="stockName">
                    <mat-header-cell class="stock-name-cell" *matHeaderCellDef mat-sort-header>File name</mat-header-cell>
                    <mat-cell *matCellDef="let element"> {{element.fileName}} </mat-cell>
                </ng-container>

                <!-- Uploaded Records Column -->
                <ng-container matColumnDef="direction">
                    <mat-header-cell *matHeaderCellDef mat-sort-header>Uploaded Records</mat-header-cell>
                    <mat-cell *matCellDef="let element" class="text-success"> {{element.totalRecords}} </mat-cell>
                </ng-container>

                <!-- Failed Records Column -->
                <ng-container matColumnDef="status">
                    <mat-header-cell *matHeaderCellDef mat-sort-header>Failed Records</mat-header-cell>
                    <mat-cell *matCellDef="let element" class="text-danger"> {{element.failedRecords}} </mat-cell>
                </ng-container>

                <!-- Closed Date Column -->
                <ng-container matColumnDef="action">
                    <mat-header-cell class="action-cell" *matHeaderCellDef mat-sort-header>Action</mat-header-cell>
                    <mat-cell *matCellDef="let element, let i = index" class="action_colum">
                        <div>
                            <mat-icon (click)="downloadFailedTrade(element)" class="mat-icon-sm trade-view">download</mat-icon>
                        </div>
                    </mat-cell>
                </ng-container>

                <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
                <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
            </mat-table>

            <!-- Angular 8 pagination -->
            <mat-paginator [pageSize]="20" [pageSizeOptions]="[5, 10, 20]" [showFirstLastButtons]="true" [length]="dataSource.totalCount">
            </mat-paginator>
        </div>
    </div>
</div>
