<div class="container">
    <h3 class="edit-trade-item">
        STRATEGY #05082020-001
    </h3>
    <div class="addnew-trade">
      <mat-horizontal-stepper labelPosition="bottom" #stepper [linear]="false">
        <mat-step [class.active]="stepone.completed" #stepone>
          <ng-template matStepLabel>Trade Details</ng-template>
  
          <div class="stepper-content">
            <app-edit-trade-details
              (nextStep)="goForward(true)"
              (activateRisk)="activeStep = true"
            ></app-edit-trade-details>
          </div>
        </mat-step>
  
        <mat-step
          [editable]="false"
          [completed]="activeStep"
          [state]="'completed'"
        >
          <ng-template matStepLabel
            ><span [class.activeStepHeading]="activeStep"
              >Strategy Builder</span
            ></ng-template
          >
          <div class="stepper-content"></div>
        </mat-step>
  
        <mat-step>
          <ng-template matStepLabel>Trade Thesis</ng-template>
          <div class="stepper-content">
            <app-trade-thesis
              (nextStep)="goForward()"
              (prevStep)="goBack(true)"
            ></app-trade-thesis>
          </div>
        </mat-step>
  
        <mat-step>
          <ng-template matStepLabel>Risk Management</ng-template>
          <div class="stepper-content">
            <app-risk-management
              (nextStep)="goForward()"
              (prevStep)="goBack()"
            ></app-risk-management>
          </div>
        </mat-step>
  
        <mat-step>
          <ng-template matStepLabel>Entry Rules</ng-template>
          <div class="stepper-content">
            <app-entry-rules (prevStep)="goBack()"></app-entry-rules>
          </div>
        </mat-step>
      </mat-horizontal-stepper>
    </div>
</div>

  <!-- Add-new-trade-mobile -->
<div class="add-newtrade-mobile">
    <div class="container">
      <div class="trade-top-heading">
        <h3>
          Edit TRADE
        </h3>
      </div>
    </div>
    <div class="trad-border"></div>
  
    <div class="new-trade-inner">
      <div class="addnew-steps">
        <mat-horizontal-stepper labelPosition="bottom" #tradeMobileStepper [linear]="false">
          <mat-step>
  
            <div class="stepper-content">
              <app-mobile-trade-details
                [stockOptions]="stockOptions"
                [stockAdded]="stockAdded"
                (nextStep)="goForward(false,true)"
                (updateStockAdded)="stockAdded = $event"
              ></app-mobile-trade-details>
            </div>
          </mat-step>
          <mat-step>
            <div class="stepper-content">
              <app-mobile-risk-analysis
              [stockOptions]="stockOptions"
              [stockAdded]="stockAdded"
                (prevStep)="goBack(false,true)"
                (nextStep)="goForward(false,true)"
                (skipAnalysis)="goForward(true,true)"
              ></app-mobile-risk-analysis>
            </div>
          </mat-step>
          <mat-step>
            <div class="stepper-content">
              <app-mobile-trade-analysis
              [stockOptions]="stockOptions"
              [stockAdded]="stockAdded"
                (prevStep)="goBack(false,true)"
                (nextStep)="goForward(false,true)"
              ></app-mobile-trade-analysis>
            </div>
          </mat-step>
  
          <mat-step>
            <div class="stepper-content">
              <app-mobile-trade-thesis
                (prevStep)="goBack(false,true)"
                (nextStep)="goForward(false,true)"
              ></app-mobile-trade-thesis>
            </div>
          </mat-step>
  
          <mat-step>
            <div class="stepper-content">
              <app-mobile-risk-management
                (prevStep)="goBack(false,true)"
                (nextStep)="goForward(false,true)"
              ></app-mobile-risk-management>
            </div>
          </mat-step>
  
          <mat-step>
            <div class="stepper-content">
              <app-mobile-entry-rules
                (prevStep)="goBack(false,true)"
              ></app-mobile-entry-rules>
            </div>
          </mat-step>
        </mat-horizontal-stepper>
      </div>
    </div>
</div>
