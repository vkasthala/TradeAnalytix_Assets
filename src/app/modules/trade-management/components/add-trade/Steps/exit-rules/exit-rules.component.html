<div class="trade-thesis-sec">
    <div class="entry-thesis-header cursor" (click)="showExitRules()">
        <span>Exit Rules</span>
        <i class="negative-amt material-icons">{{hideExitRules ? 'keyboard_arrow_up' : 'keyboard_arrow_down'}}</i>
    </div>

    <div class="trade-thesis-body" *ngIf="!hideExitRules">

        <div class="row" *ngFor="let exit of exitRules;">
            <div class="col-sm-6">
                <div class="thesis_item">
                    <div class="thesis_item_title">
                        {{exit.description}}
                    </div>
                    <div class="switch">
                        <input type="checkbox" checked id="hedging" [(ngModel)]="exit.aligned" [disabled]="closeTrade" [ngClass]="closeTrade ? 'disabled' : ''" />
                    </div>
                    <input type="text" class="trade-check" placeholder="Add notes" [disabled]="closeTrade" [ngClass]="closeTrade ? 'disabled' : ''" />
                </div>
            </div>        
        </div>
    </div>
</div>
