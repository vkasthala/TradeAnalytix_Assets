        <div class="text-right">
            <span class="cursor" (click)="evalRules($event)"><mat-icon class="form-icon-down">refresh</mat-icon></span>
        </div>
        

        <mat-table [dataSource]="entryRules" class="w-100">
            <ng-container matColumnDef="msg">
                <th mat-header-cell *matHeaderCellDef class="msg-cell">Rule</th>
                <td mat-cell *matCellDef="let element" class="msg-cell"> {{element.msg}} </td>
            </ng-container>

            <ng-container matColumnDef="aligned">
                <th mat-header-cell *matHeaderCellDef class="aligned-cell pl-3"><span>Aligned</span></th>
                <td mat-cell *matCellDef="let element" class="aligned-cell pl-3">
                    <mat-icon class="mat-icon-warning mat-icon-sm" *ngIf="element.type === 'Coded' && !element.aligned">warning
                    </mat-icon>
                    <mat-checkbox *ngIf="element.type === 'Coded' && element.aligned === true" [disabled] = "true" [checked] = "true" class="checkbox-green">
                    </mat-checkbox>
                    <mat-checkbox *ngIf="element.type !== 'Coded'" [(ngModel)]="element.aligned" class="checkbox-green">
                    </mat-checkbox>
                </td>
            </ng-container>

            <ng-container matColumnDef="comment">
                <th mat-header-cell *matHeaderCellDef class="comment-cell"><span>Comment</span></th>
                <td mat-cell *matCellDef="let element" class="comment-cell">
                    <span class="d-flex align-items-center"
                        *ngIf="!viewTradePlan && !(element.type === 'Coded' && (!element.id || element.id === 0))">
                        {{element.comment}}
                        <mat-icon class="mat-icon-edit mat-icon-sm" (click)="onCommentEdit(element)">edit
                        </mat-icon>
                    </span>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="ruleGridColumns" style="height: 50px;"></tr>
            <tr mat-row *matRowDef="let row; columns: ruleGridColumns;"></tr>
        </mat-table>
        <div class="p-3 text-center" *ngIf="entryRules && entryRules.length === 0">Entry rules have not been set up</div>
    </div>
</div>
