        <mat-table [dataSource]="entryRules" class="d-table w-100">
            <ng-container matColumnDef="msg">
                <th mat-header-cell *matHeaderCellDef class="msg-cell align-middle">Rule</th>
                <td mat-cell *matCellDef="let element" class="align-middle"> {{element.msg}} </td>
            </ng-container>

            <ng-container matColumnDef="aligned">
                <th mat-header-cell *matHeaderCellDef class="align-middle pl-3"><span>Aligned</span></th>
                <td mat-cell *matCellDef="let element" class="align-middle pl-3">
                    <mat-icon class="mat-icon-warning mat-icon-sm" *ngIf="element.type === 'Coded'">warning
                    </mat-icon>
                    <mat-checkbox *ngIf="element.type !== 'Coded'" [(ngModel)]="element.aligned" class="checkbox-green">
                    </mat-checkbox>
                </td>
            </ng-container>

            <ng-container matColumnDef="comment">
                <th mat-header-cell *matHeaderCellDef class="align-middle"><span>Comment</span></th>
                <td mat-cell *matCellDef="let element" class="align-middle">
                    <span class="d-flex align-items-center"
                        *ngIf="!viewTradePlan && !(element.type === 'Coded' && (!element.id || element.id === 0))">
                        {{element.comment}}
                        <mat-icon class="mat-icon-edit mat-icon-sm" (click)="onCommentEdit(element)">edit
                        </mat-icon>
                    </span>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="ruleGridColumns" style="height: 50px;"></tr>
            <tr mat-row *matRowDef="let row; columns: ruleGridColumns;"></tr>
        </mat-table>
