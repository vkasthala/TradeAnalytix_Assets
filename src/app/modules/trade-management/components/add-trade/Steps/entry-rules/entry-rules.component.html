<div class="trade-thesis-sec">
    <div class="trade-thesis-heading">
        <h4 class="text-success d-flex align-items-center">
            <i class="negative-amt material-icons">keyboard_arrow_right</i> Entry Rules
        </h4>
    </div>
    <div class="mb-3">
        <div class="thesis-list-inner row mx-0 ml-2">
            <div class="col-6 list-inner-left">
                Always protect your investment by hedging
            </div>
            <div class="switch">
                <input type="checkbox" checked id="hedging" [(ngModel)]="entryRules[0].aligned" [disabled]="closeTrade"/>
                <label for="hedging"></label>
            </div>
        </div>
        <div class="thesis-list-inner row mx-0 ml-2">
            <div class="col-6 list-inner-left">
                Do not trade options expiring in the same week
            </div>
            <div class="switch">
                <input type="checkbox" id="same_week" name="same_week" [(ngModel)]="entryRules[1].aligned" [disabled]="closeTrade"/>
                <label for="same_week"></label>
            </div>
            <input type="text" class="trade-check" placeholder="Specify reason for not aligning with the rule"
                [(ngModel)]="entryRules[1].comment" [disabled]="closeTrade" />
        </div>
        <div class="thesis-list-inner row mx-0 ml-2">
            <div class="col-6 list-inner-left">
                Do not put more than 100,000 in a stock
            </div>
            <div class="switch">
                <input type="checkbox" checked id="onelack_stock" name="onelack_stock"
                    [(ngModel)]="entryRules[2].aligned" [disabled]="closeTrade" />
                <label for="onelack_stock"></label>
            </div>
        </div>
        <div class="thesis-list-inner row mx-0 ml-2">
            <div class="col-6 list-inner-left">
                Trade only the stocks that were planned for the day
            </div>
            <div class="switch">
                <input type="checkbox" id="planned_day" name="planned_day" [(ngModel)]="entryRules[3].aligned" [disabled]="closeTrade" />
                <label for="planned_day"></label>
            </div>
            <input type="text" class="trade-check" placeholder="Specify reason for not aligning with the rule"
                [(ngModel)]="entryRules[3].comment" [disabled]="closeTrade" />
        </div>
    </div>
</div>
