<div class="compare-popup">
    <div class="compare-pop-inner">
        <div class="top-pop-inner">
            <div class="modal-title">{{title}}</div>
            <div class="right-close" (click)="closeModal()">
                <mat-icon>clear</mat-icon>
            </div>
        </div>

        <div class="main-pop-inner">
            <div class="d-flex mb-2 align-items-center">
                <label class="col-form-label">Tags</label>
                <div class="col-8">
                    <app-trade-tags></app-trade-tags>
                </div>
            </div>
            <div class="d-flex mb-2 align-items-center">
                <label class="col-form-label">Strategy</label>
                <div class="col-8 col-md-4">
                    <select class="form-control">
                        <option value="0">Call Spread</option>
                    </select>
                </div>
            </div>
            <div class="d-flex mb-2 align-items-center">
                <label class="col-form-label">Direction</label>
                <div class="col-8 col-md-4">
                    <select class="form-control">
                        <option value="0">Long</option>
                    </select>
                </div>
            </div>
            <div class="d-flex mb-2 align-items-center">
                <label class="col-form-label">Contrarian Trade</label>
                <div class="col-8 col-md-4">
                    <select class="form-control">
                        <option value="0">Yes</option>
                    </select>
                </div>
            </div>
            <div class="d-flex mb-2 align-items-center">
                <label class="col-form-label">Planned Trade</label>
                <div class="col-8 col-md-4">
                    <select class="form-control">
                        <option value="0">Yes</option>
                    </select>
                </div>
            </div>
            <div class="d-flex mb-2 align-items-center">
                <label class="col-form-label">Trade Thesis</label>
                <div class="col-8">
                    <textarea rows="4" class="form-control"></textarea>
                </div>
            </div>
            <div class="d-flex mb-2">
                <label class="col-form-label">Upload Files</label>
                <div class="col-9">
                    <app-upload-files></app-upload-files>
                </div>
            </div>

            <div class="d-flex mb-2 align-items-center">
                <label class="col-form-label">Source of Trade</label>
                <div class="col-9">
                    <div class="d-flex align-items-center">
                        <select class="form-control">
                            <option value="0">Self</option>
                        </select>
                        <span class="text-primary ml-3">
                            <mat-icon class="text-primary cursor" (click)="onItemAdd()">add_circle</mat-icon>
                        </span>
                    </div>
                </div>
            </div>
            <div class="d-flex mb-2 align-items-center">
                <label class="col-form-label">Target Price </label>
                <div class="col-8 col-md-5 pr-0">
                    <input type="text" class="form-control" value="500.00" />
                </div>
            </div>
            <div class="d-flex mb-2 align-items-center">
                <label class="col-form-label">Technical Indicator</label>
                <div class="col-9">
                    <div class="d-flex align-items-center">
                        <input type="text" class="form-control" value="Support" />
                        <span class="d-flex text-primary ml-3">
                            <mat-icon class="text-primary cursor" (click)="onItemAdd()">add_circle</mat-icon>
                        </span>
                    </div>
                </div>
            </div>
            <div class="d-flex mb-2 align-items-center">
                <label class="col-form-label">Event</label>
                <div class="col-8">
                    <div class="d-flex align-items-center">
                        <input type="text" class="form-control" value="Earnings" /> 
                        <span class="text-primary ml-3">
                            <mat-icon class="text-primary cursor" (click)="onItemAdd()">add_circle</mat-icon>
                        </span>
                    </div>
                </div>
            </div>
            <div class="d-flex mb-2 align-items-center">
                <label class="col-form-label">Mindset</label>
                <div class="col-8">
                    <div class="d-flex align-items-center">
                        <input type="text" class="form-control" value="FOMO" /> 
                        <span class="text-primary ml-3">
                            <mat-icon class="text-primary cursor" (click)="onItemAdd()">add_circle</mat-icon>
                        </span>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-footer py-2">
            <button type="button" class="btn btn-join m-0" (click) = "saveFieldSettings()">Save</button>
        </div>
    </div>
</div>
