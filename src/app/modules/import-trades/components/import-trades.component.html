<div class="container">
    <div class="trade-dash-main">
        <div class="trade-dash-name">
            <h3>
            Import Trades
            </h3>
        </div>
    </div>
    <div>      
      <label class="btn btn-default">
        <input type="file" (change)="selectFile($event)" />
      </label>
      <button class="btn btn-success" [disabled]="!selectedFiles" (click)="importTrades()">
        Upload
      </button>
    </div>
</div>
