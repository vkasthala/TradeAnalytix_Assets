<div class="px-3 mt-3">
    <div class="main-body">
        <div class="addnew-first">
            <div class="trade-form">
                <div class="d-flex align-items-center justify-content-between">
                    <mat-icon class="trade-form-icon">import_export</mat-icon>

                </div>
                <h2 class="py-3 symbol-heading">Import Trades</h2>
                <div class="pb-3 symbol-description">Upload transaction history from the brokerage systems to add or update trade strategies in bulk.</div>
                <div class="d-flex align-items-center">
                    <label class="col-form-label p-0 mr-2">Select Brokerage</label>
                    <select class="form-control col-sm-6">
                        <option value="1">Zerodha</option>
                        <option value="2">ICICIDirect</option>
                        <option value="3">IIFL</option>
                        <option value="4">Edelweiss</option>
                        <option value="5">tdAmeritrade</option>
                        <option value="6">eTrade</option>
                    </select>
                </div>
                <div class="d-flex mt-2 align-items-center">
                    <div class="media-body">
                        <input type="file" (change)="selectFile($event)" />
                    </div>
                    <button class="btn btn-enter btn-sm" [disabled]="!selectedFiles" (click)="importTrades()">Upload</button>
                </div>
                <div class="text-right py-2">
                    <a class="top-nav-link" [routerLink]="['/import-trades-history/']" style="text-decoration: underline;">View Import History</a>
                </div>
            </div>
        </div>
    </div>
</div>
