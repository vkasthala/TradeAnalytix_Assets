<div>
    <div class="trade-cards-section">
        <span class="card-main new-value">
            <input type="text" class="form-control" [(ngModel)]="newValue" />
        </span>
        <span class="text-primary" *ngIf="!edit">
            <mat-icon class="mt-2 text-success action-icon" (click)="onItemAdd()">add_circle</mat-icon>
        </span>
        <span class="text-primary" *ngIf="edit">
            <mat-icon class="mt-2 text-success action-icon" (click)="onItemEdit()">check_circle</mat-icon>
        </span>
        <span class="text-primary" *ngIf="edit">
            <mat-icon class="mt-2 text-danger action-icon" (click)="onCancel()">close</mat-icon>
        </span>
    </div>

    <mat-selection-list [(ngModel)]="selectedItems">
        <mat-list-option *ngFor="let item of items;let i=index" [value]="item" (click)="onSelectedItemChange(item)">
            <span>{{item.name}}</span>
            <mat-icon class="mat-icon-sm delete-icon" (click)="onDelete(i)">delete</mat-icon>
        </mat-list-option>
    </mat-selection-list>
</div>
