<div class="datepicker-group">
    <input 
        class="form-control bg-white"
        matInput 
        [matDatepicker]="datePicker" 
        id="dateField"
        name="dateField" 
        [(ngModel)]="dateValue" />
    <mat-datepicker-toggle matSuffix [for]="dateField">
    </mat-datepicker-toggle>
    <mat-datepicker #datePicker></mat-datepicker>
</div>
