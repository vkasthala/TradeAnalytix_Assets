<div class="datepicker-group">
    <input 
        class="form-control bg-white"
        matInput 
        [matDatepicker]="datePickerId" 
        id="dynamicDateField"
        name="field.value" 
        [(ngModel)]="field.value" />
    <mat-datepicker-toggle matSuffix [for]="dynamicDateField">
    </mat-datepicker-toggle>
    <mat-datepicker #datePickerId></mat-datepicker>
</div>
