<div class="compare-popup">
  <div class="compare-pop-inner">
    <div class="top-pop-inner">
      <div class="left-heading">
        <h6>{{data.title}} Quantity</h6>
      </div>
      <div class="right-close" (click)="closeModal()">
        <span>close</span>
      </div>
    </div>

    <div class="main-pop-inner">
      <div class="row mb-2 align-items-center">
        <label class="col-6 col-form-label">Action : {{data.actionTyp}}</label>
        <!-- <div class="col-6">
          <select id="inputState" class="form-control select-input" [(ngModel)]="data.actionType">
            <option value=1 [hidden]="!addTrade" selected data-default>Buy to Open</option>
            <option value=2 [hidden]="!addTrade">Sell to Open</option>
            <option value=3 [hidden]="!addTrade">Buy to Close</option>
            <option value=4 [hidden]="!addTrade">Sell to Close</option>
          </select>
        </div> -->
      </div>
      <div class="row mb-2 align-items-center">
        <label class="col-6 col-form-label">Enter Contracts</label>
        <div class="col-6">
          <input type="number" (keydown)="preventNegatives($event, false)" min="0" class="form-control cards-input"
            [(ngModel)]="data.contracts" />
        </div>
      </div>
      <div class="row mb-2 align-items-center">
        <label class="col-6 col-form-label">Option Price </label>
        <div class="col-6">
          <div class="form-group">
            <input type="number" (keydown)="preventNegatives($event, true)" pattern="^\d*(\.\d{0,2})?$"
              (change)="checkForDecimalValidation($event)" step="0.01" min="0" class="form-control cards-input"
              placeholder="" [(ngModel)]="data.price" />
          </div>
        </div>
      </div>
      <div class="row align-items-center">
        <label class="col-6 col-form-label">Amount</label>
        <div class="col-6">
          <h6>{{data.contracts && data.price ? (data.contracts * data.price).toFixed(2) : 0}}
          </h6>
        </div>
      </div>
      <div class="row align-items-center">
        <label class="col-6 col-form-label">Execution Date</label>
        <div class="col-6">
          <div class="datepicker-group datepicker-sm">
            <input matInput [matDatepicker]="execution_date">
            <mat-datepicker-toggle matSuffix [for]="execution_date"></mat-datepicker-toggle>
            <mat-datepicker #execution_date></mat-datepicker>
          </div>
        </div>
      </div>
      <div class="pb-1">
        <label class="col-form-label">Notes</label>
        <textarea rows="2" class="form-control"></textarea>
      </div>

      <div class="btn-up mb-0">
        <button type="button" class="btn btn-add" [mat-dialog-close]="data">SAVE</button>
      </div>
    </div>

  </div>
</div>
