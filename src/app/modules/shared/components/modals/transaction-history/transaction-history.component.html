<div class="compare-popup">
    <div class="compare-pop-inner">
        <div class="top-pop-inner">
            <div class="left-heading">
                <h6>Transaction History</h6>
            </div>
            <div class="right-close" (click)="closeModal()">
                <mat-icon>clear</mat-icon>
            </div>
        </div>

        <div class="main-pop-inner">
            <div class="row mb-2 align-items-center">
                <label class="col-form-label col-4">Transaction Date</label>
                <label class="col-form-label col-3">Quantity</label>
                <label class="col-form-label col-2">Price</label>
                <label class="col-form-label col-3">Cost</label>
            </div>

            <div class="row mb-1" *ngFor="let item of history;let index=index">
                <span class="col-4 text-center">{{item.executionDate | date: 'dd-MMM-yyyy'}}</span>
                <span class="col-3 text-center">{{item.quantity}}</span>
                <span class="col-2">{{item.price}}</span>
                <span class="col-3">{{item.cost}}</span>
            </div>
