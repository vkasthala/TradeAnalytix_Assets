<div class="compare-popup">
    <div class="compare-pop-inner">
        <div class="top-pop-inner">
            <div class="left-heading">
                <h6>Update 05232020-FB001</h6>
            </div>
            <div class="right-close" (click)="closeModal()">
                <mat-icon>clear</mat-icon>
            </div>
        </div>

        <div class="main-pop-inner">
            <div class="d-flex justify-content-between">
                <label class="col-form-label col-4 px-0"></label>
                <label class="col-form-label px-2">Contracts</label>
                <label class="col-form-label pr-2">Days Left</label>
                <label class="col-form-label">Imp. Volatility(%)</label>
            </div>
            <div class="risk-box risk-af card-m" *ngFor="let item of stockOptions;let index=index">
                <div class="d-flex justify-content-between mb-3">
                    <label class="col-form-label col-4 px-0">Sell 355 Jun-19-2020 Call </label>
                    <div class="px-3">
                        <div class="stock-inc">
                            <a (click)="decreaseContracts(index)" (mousedown)="mousedown('decreaseContracts', index)" (mouseup)="mouseup()" (mouseleave)="mouseup()">
                                <mat-icon class="text-primary">remove_circle</mat-icon>
                            </a>
                            <span>
                            <input (keydown)="preventNegatives($event, true)" type="number"
                                class="hide-bars" step="0.1" min="0" max="730" minlength="0"
                                maxlength="730" [(ngModel)]="item.contracts">
                        </span>
                            <a (click)="increaseContracts(index)" (mousedown)="mousedown('increaseContracts', index)" (mouseup)="mouseup()" (mouseleave)="mouseup()">
                                <mat-icon class="text-primary">add_circle</mat-icon>
                            </a>
                        </div>
                    </div>
                    <div class="pr-3">
                        <div class="stock-inc">
                            <a (click)="decreaseDaysLeft(index)" (mousedown)="mousedown('decreaseDaysLeft', index)" (mouseup)="mouseup()" (mouseleave)="mouseup()">
                                <mat-icon class="text-primary">remove_circle</mat-icon>
                            </a>
                            <span>
                            <input (keydown)="preventNegatives($event, true)" type="number"
                                class="hide-bars" step="0.1" min="0" max="730" minlength="0"
                                maxlength="730" [(ngModel)]="item.daysLeft">
                        </span>
                            <a (click)="increaseDaysLeft(index)" (mousedown)="mousedown('increaseDaysLeft', index)" (mouseup)="mouseup()" (mouseleave)="mouseup()">
                                <mat-icon class="text-primary">add_circle</mat-icon>
                            </a>
                        </div>
                    </div>
                    <div>
                        <div class="stock-inc">
                            <a (click)="decreaseImpliedValue(index)" (mousedown)="mousedown('decreaseImpliedValue', index)" (mouseup)="mouseup()" (mouseleave)="mouseup()">
                                <mat-icon class="text-primary">remove_circle</mat-icon>
                            </a>
                            <div class="stock-p">
                                <input type="number" class="hide-bars" min="1" max="500" minlength="1" maxlength="500" [(ngModel)]="item.impliedVolatility" (input)="enforceMaxLength($event, 1, 500)">
                                <p>&#37;</p>
                            </div>
                            <a (click)="increaseImpliedValue(index)" (mousedown)="mousedown('increaseImpliedValue', index)" (mouseup)="mouseup()" (mouseleave)="mouseup()">
                                <mat-icon class="text-primary">add_circle</mat-icon>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="separator"></div>

            <div class="text-right">
                <button type="button" class="btn btn-add" [mat-dialog-close]="data">Save</button>
            </div>
        </div>

    </div>
</div>
