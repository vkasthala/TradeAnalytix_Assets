<div class="trade-app">
    <!-- end: header-section -->
    <div class="main-body">
        <div class="wrapper trade-app-dashboard">
            <div class="tab vertical-tabs">
                <ul class="nav-tabs w-100">
                    <li>
                        <a routerLink="getting-started" routerLinkActive="active-link" >
                            <span>Getting Started</span>
                        </a>
                    </li>
                    <li>
                        <a [routerLink]="['add-trade']" routerLinkActive="active-link">
                            <span>Add Trade</span>

                    </li>

                    <li>
                        <a [routerLink]="['import-trade']" routerLinkActive="active-link">
                            <span>Import Trades</span>
                        </a>
                    </li>
    
                    <li>
                        <a [routerLink]="['trade-plan']" routerLinkActive="active-link">
                            <span>Trade Plan</span>
                        </a>
                    </li>
                    <li>
                        <a [routerLink]="['helprisk-analysis']" routerLinkActive="active-link">
                            <span>Risk Analysis</span>
                        </a>
                    </li>
                    <li [class.nav-active]="currentRoute == 'compare-strategy'">
                        <a [routerLink]="['compare-strategy']" routerLinkActive="active-link">

                    </li>

                        </a>
                    </li>
    
                    <li [class.nav-active]="currentRoute == 'helpreports'">

                        </a>

                        </a>
                    </li> -->

            <div class="main">
                <router-outlet></router-outlet>
            </div>
