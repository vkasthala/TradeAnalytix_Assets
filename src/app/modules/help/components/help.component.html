<div class="trade-app">

                            <a class="sidebar-link" routerLink="getting-started" routerLinkActive="active-link" >
                                <span>Getting Started</span>

                        </li>
                        <li class="sidebar-item">
                            <a class="sidebar-link" [routerLink]="['trade-journal']" routerLinkActive="active-link">

                        <li class="sidebar-item">
