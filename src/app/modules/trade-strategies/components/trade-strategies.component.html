<div class="container">
    <div class="trade-strategies-sec">

        <div class="add-new-trade-btn">
            <button routerLink="/new-trade" class="add-new btn btn-apply">
                + ADD NEW TRADE</button>
        </div>
        <div class="trade-strategies-table">
            <div class="card mb-4">
                <div class="card-body">

                    <!-- trade-btns -->

                    <div class="trade-st-box">
                        <div class="st-slect-section">
                            <div class="trade-form">

                                <div class="form-group has-search">
                                    <app-trade-search (symbolSelectEvent)="symbolSelectEventHandler($event)"
                                        #tradeSearchComponent>
                                    </app-trade-search>
                                    <img src="../../../../assets/images/icon/Icon awesome-search.png" alt=""
                                        class="form-icon">

                                </div>
                            </div>
                        </div>
                        <div class="st-slect-section">
                            <div class="trade-sel position-relative">
                                <span class="custom-label" *ngIf="strategyLabel">Select Strategy</span>
                                <select class="form-control select-input" id="strategy_inputState" [(ngModel)]='strategiesGridFilter.strategy'
                                (change)='onOptionsSelected($event)' name="strategy">
                                    <option *ngFor="let key of strategyTypes" [value]="key" [label]="strategies[key]">
                                    </option>
                                </select>
                                <img src="../../../../assets/images/icon/Icon ionic-ios-arrow-down.png" alt="" class="form-icon-down" />
                            </div>
                        </div>
                        <div class="st-slect-section">
                            <div class="trade-sel position-relative">
                                <span class="custom-label" *ngIf="statusLabel">Select Status</span>
                                <select class="form-control" id="tradeStrategyStatusFilter" [(ngModel)]='strategiesGridFilter.status' (change)='onOptionsSelected($event)'>
                                    <option *ngFor="let key of tradeStatusNames" [value]="key"
                                        [label]="tradeStatues[key]"></option>
                                </select>
                                <img src="../../../../assets/images/icon/Icon ionic-ios-arrow-down.png" alt=""
                                    class="form-icon-down">
                            </div>
                        </div>
                        <div class="st-slect-section">
                            <div class="trade-date">
                                <my-date-range-picker placeholder="Date range" name="mydaterange"
                                    [options]="myDateRangePickerOptions"
                                    (dateRangeChanged)="onDateRangeChanged($event)"></my-date-range-picker>
                            </div>
                        </div>
                        <div class=" st-slect-section select-btn">
                            <button class="btn btn-apply" (click)="applyFilters()">APPLY FILTERS</button>
                            &nbsp; &nbsp;
                            <button type="button" class="btn btn-link " (click)="clearFilters()">Clear</button>
                        </div>

<!-- for-mobile -->
<div class="trade-st-mobile">
    <div class="container">

        <div class="trade-top-heading">
            <h3>
                TRADE STRATEGIES
            </h3>
        </div>
    </div>
    <div class="trad-border"></div>

    <div class="container">

        <div class="trade-top-sec">
            <div class="st-slect-section">
                <div class="trade-form">

                    <div class="form-group has-search">
                        <input type="text" class="form-control" placeholder="Symbol or Stock Name">
                        <img src="../../../../assets/images/icon/Icon awesome-search.png" alt="" class="form-icon">

                    </div>
                </div>
            </div>

        </div>

        <div class="trade-table">
            <table class="table table-striped">
                <thead>
                    <tr>

                        <th>Strategy ID</th>
                        <th>Symbol</th>
                        <th>Strategy</th>
                        <th>Status</th>
                        <th>Return</th>

                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of minifiedTradeStrategiesData; let i=index">
                        <td class="mobile-de"><a class="trade-h" (click)="expandRowOptions(i)">{{item.strategyId}}</a>
                            <div class="trade-det-box" *ngIf="expandIndex == i">
                                <div class="de-box">

                                    <div class="right-con">

                                        <a class="box-icon">
                                            <img src="../../../../assets/images/icon/Icon material-edit.png" alt="">
                                            <span>Edit</span>
                                        </a>
                                        <a class="box-icon" (click)="closeTrade(item.strategyId)">
                                            <img src="../../../../assets/images/icon/Icon material-close.png" alt="">
                                            <span>Close</span>
                                        </a>
                                        <a class="box-icon">
                                            <img src="../../../../assets/images/icon/Icon material-delete.png" alt="">
                                            <span>Delete</span>
                                        </a>
                                    </div>

                                    <div class="dt-top-icon" (click)="closeActionBox()">
                                        <img src="../../../../assets/images/icon/Icon ionic-ios-close-circle.png"
                                            alt="">
                                    </div>
                                </div>
                            </div>
                        </td>
                        <td>{{item.symbol}}</td>
                        <td>{{item.strategy}}</td>
                        <td [ngClass]="{
                                'text-warning': item.status == 'Open',
                                'text-danger': item.status == 'Closed',
                                'text-primary': item.status == 'Draft',
                                'text-secondary': item.status == 'Expired'
                            }">{{item.status}}</td>
                        <td class="text-success">{{item.return}}</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>
