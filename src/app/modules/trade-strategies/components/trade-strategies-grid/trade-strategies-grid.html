<div class="mat-elevation-z8">
  <table mat-table [dataSource]="dataSource">

    <!-- Strategy ID Column -->
    <ng-container matColumnDef="strategyId">
      <th mat-header-cell *matHeaderCellDef>Strategy ID</th>
      <td mat-cell *matCellDef="let element"> {{element.strategyId}} </td>
    </ng-container>

    <!-- Strategy Column -->
    <ng-container matColumnDef="strategy">
      <th mat-header-cell *matHeaderCellDef>Strategy</th>
      <td mat-cell *matCellDef="let element"> {{element.strategy}} </td>
    </ng-container>

    <!-- Stock Column -->
    <ng-container matColumnDef="stock">
      <th mat-header-cell *matHeaderCellDef>Stock</th>
      <td mat-cell *matCellDef="let element"> {{element.stock}} </td>
    </ng-container>

    <!-- Direction Column -->
    <ng-container matColumnDef="direction">
      <th mat-header-cell *matHeaderCellDef>Direction</th>
      <td mat-cell *matCellDef="let element"> {{element.direction}} </td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let element"> {{element.status}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <!-- Angular 8 pagination -->
<mat-paginator [pageSizeOptions]="[5, 10, 15]" showFirstLastButtons></mat-paginator>
</div>
